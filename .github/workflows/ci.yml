name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sintassi di ogni modulo (node --check)
        run: |
          set -e
          count=0
          for f in js/*.js; do
            [ -e "$f" ] || { echo 'Nessun modulo trovato in js/'; exit 1; }
            node --check "$f"
            echo "OK: $f"
            count=$((count+1))
          done
          echo "Moduli verificati: $count"

      - name: Concatenazione moduli 1-12 sintatticamente valida
        run: |
          set -e
          cat js/config.js js/matematica.js js/futures.js js/opzioni.js \
              js/render-futures.js js/render-opzioni.js js/grafico.js \
              js/calcola-tutto.js js/schede.js js/storage.js js/eventi.js \
              js/main.js > /tmp/app-concat.js
          node --check /tmp/app-concat.js
          echo 'OK: concatenazione in ordine 1-12 valida'

      - name: Lint concatenazione (variabili non definite, codice irraggiungibile, chiavi duplicate)
        run: |
          set -e
          cat > /tmp/eslintrc.json <<'JSON'
          {
            "root": true,
            "parserOptions": { "ecmaVersion": 2022, "sourceType": "script" },
            "env": { "browser": true },
            "rules": {
              "no-undef": "error",
              "no-debugger": "error",
              "no-dupe-keys": "error",
              "no-unreachable": "error",
              "no-redeclare": "warn",
              "no-unused-vars": "warn"
            }
          }
          JSON
          if npx --yes eslint@8.57.1 --no-eslintrc -c /tmp/eslintrc.json /tmp/app-concat.js > /tmp/lint-output.txt 2>&1; then
            echo 'OK: lint superato (warning ammessi)'
          else
            echo '::error::Il lint ha trovato errori — dettagli nel commento sulla PR'
            exit 1
          fi

      - name: Dettaglio errori lint sulla PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### ❌ Lint concatenazione — errori rilevati'
            echo ''
            echo '```'
            head -c 20000 /tmp/lint-output.txt
            echo ''
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md

      - name: Nessun file JS fuori da js/
        run: |
          found=$(find . -name '*.js' -not -path './js/*' -not -path './.git/*')
          if [ -n "$found" ]; then
            echo '::error::File JS fuori da js/ non ammessi (duplicati)'
            echo "$found"
            exit 1
          fi
          echo 'OK: nessun file JS fuori da js/'

      - name: Nessun console.log/debugger nei sorgenti
        run: |
          hits=$(grep -rnE '\bconsole\.(log|debug|info)\b|\bdebugger\b' js/ index.html css/ || true)
          if [ -n "$hits" ]; then
            echo '::error::console.log/debugger non ammessi nei sorgenti (usare la UI)'
            echo "$hits"
            exit 1
          fi
          echo 'OK: nessun console.log/debugger'

      - name: Ogni id usato con el(...) esiste in index.html o e creato dinamicamente
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const files = fs.readdirSync('js').filter(f => f.endsWith('.js')).map(f => 'js/' + f);
          const js = files.map(f => fs.readFileSync(f, 'utf8')).join('\n');
          const html = fs.readFileSync('index.html', 'utf8');
          const used = new Set();
          for (const m of js.matchAll(/\bel\(\s*(['"])([A-Za-z][\w-]*)\1\s*\)/g)) used.add(m[2]);
          const present = new Set();
          for (const m of html.matchAll(/id=["'`][A-Za-z][\w-]*/g)) present.add(m[0].slice(4));
          for (const m of js.matchAll(/id=\\?["'`\\]+([A-Za-z][\w-]*)/g)) present.add(m[1]);
          const missing = [...used].filter(id => !present.has(id));
          if (missing.length) {
            for (const id of missing) console.error("::error::el('" + id + "') punta a un id assente in index.html e non creato dinamicamente");
            process.exit(1);
          }
          console.log('OK: ' + used.size + ' id verificati, tutti presenti');
          NODE

      - name: Guardia dimensioni file sorgente (max 512 KB)
        run: |
          big=$(find js css -type f -size +512k)
          if [ -n "$big" ]; then
            echo '::error::File sorgente oltre 512 KB — probabile commit accidentale'
            echo "$big"
            exit 1
          fi
          echo 'OK: nessun file sorgente oltre 512 KB'

      - name: index.html carica i 12 moduli nell'ordine corretto
        run: |
          expected='js/config.js js/matematica.js js/futures.js js/opzioni.js js/render-futures.js js/render-opzioni.js js/grafico.js js/calcola-tutto.js js/schede.js js/storage.js js/eventi.js js/main.js'
          actual=$(grep -o 'src="js/[^"]*"' index.html | sed 's/^src="//;s/"$//' | tr '\n' ' ' | sed 's/ $//')
          if [ "$actual" != "$expected" ]; then
            echo '::error::Ordine script in index.html non corretto'
            echo "atteso : $expected"
            echo "attuale: $actual"
            exit 1
          fi
          echo 'OK: ordine di caricamento dei moduli corretto'

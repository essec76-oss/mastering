name: Pulizia codice morto

on:
  push:
    branches: [pulizia-codice-morto]

permissions:
  contents: write
  pull-requests: write

jobs:
  pulizia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara ESLint
        run: |
          cat > /tmp/eslintrc.json <<'JSON'
          {
            "root": true,
            "parserOptions": {
              "ecmaVersion": 2022,
              "sourceType": "script"
            },
            "env": {
              "browser": true,
              "es2022": true
            },
            "rules": {
              "no-unused-vars": "warn"
            }
          }
          JSON

      - name: Rimuovi dichiarazioni inutilizzate
        run: |
          node <<'NODE' > /tmp/pulizia.txt
          const fs = require('fs');
          const cp = require('child_process');
          const order = ['config.js', 'matematica.js', 'futures.js',
            'opzioni.js', 'render-futures.js', 'render-opzioni.js',
            'grafico.js', 'calcola-tutto.js', 'schede.js',
            'storage.js', 'eventi.js', 'main.js'];
          const rep = [];
          let total = 0;
          let failed = false;
          let backup = null;
          function contents() {
            return order.map(f => fs.readFileSync('js/' + f, 'utf8'));
          }
          function lintOf(concat) {
            fs.writeFileSync('/tmp/app.js', concat);
            try { fs.unlinkSync('/tmp/lint.json'); } catch (e) {}
            const cmd = 'npx --yes eslint@8.57.1 --no-eslintrc' +
              ' -c /tmp/eslintrc.json -f json -o /tmp/lint.json' +
              ' /tmp/app.js';
            try { cp.execSync(cmd, { stdio: 'pipe' }); } catch (e) {}
            return JSON.parse(
              fs.readFileSync('/tmp/lint.json', 'utf8'));
          }
          function originsOf(cs, concat) {
            const starts = [];
            let acc = 0;
            for (const c of cs) { starts.push(acc); acc += c.length; }
            const orig = [];
            let pos = 0;
            for (const line of concat.split('\n')) {
              let fi = 0;
              for (let k = 0; k < starts.length; k++) {
                if (starts[k] <= pos) fi = k;
              }
              const local = concat.slice(starts[fi], pos);
              orig.push(order[fi] + ':' + local.split('\n').length);
              pos += line.length + 1;
            }
            return orig;
          }
          function topComma(s) {
            let d = 0;
            for (const ch of s) {
              if (ch === '(' || ch === '[' || ch === '{') d++;
              else if (ch === ')' || ch === ']' || ch === '}') d--;
              else if (ch === ',' && d === 0) return true;
            }
            return false;
          }
          function snapshot() {
            if (backup) return;
            backup = new Map();
            const cs = contents();
            for (let i = 0; i < order.length; i++) {
              backup.set(order[i], cs[i]);
            }
          }
          function restore() {
            for (const ent of backup) {
              fs.writeFileSync('js/' + ent[0], ent[1]);
            }
          }
          let round = 0;
          while (round < 4) {
            round++;
            const cs = contents();
            const concat = cs.join('');
            const lint = lintOf(concat);
            const errs = [];
            const msgs = [];
            for (const r of lint) {
              for (const m of r.messages || []) {
                if (m.severity === 2) errs.push(m);
                else if (m.ruleId === 'no-unused-vars') {
                  msgs.push(m);
                }
              }
            }
            if (errs.length) {
              if (backup) restore();
              rep.push('ERRORI lint inattesi: ' + errs.length);
              for (const m of errs.slice(0, 5)) {
                rep.push('  concat riga ' + m.line + ': ' + m.message);
              }
              failed = true;
              break;
            }
            if (!msgs.length) break;
            const orig = originsOf(cs, concat);
            const per = new Map();
            for (const m of msgs) {
              const nm = (m.message.match(/'([^']+)'/) || [])[1];
              if (!nm) continue;
              const key = orig[m.line - 1];
              if (!per.has(key)) per.set(key, []);
              if (!per.get(key).includes(nm)) {
                per.get(key).push(nm);
              }
            }
            const byFile = new Map();
            for (const ent of per) {
              const p = ent[0].split(':');
              const f = p[0];
              const l = parseInt(p[1], 10);
              if (!byFile.has(f)) byFile.set(f, []);
              byFile.get(f).push({ l: l, names: ent[1] });
            }
            let ops = 0;
            for (const ent of byFile) {
              const f = ent[0];
              const path = 'js/' + f;
              const lines =
                fs.readFileSync(path, 'utf8').split('\n');
              const del = new Set();
              const repLine = new Map();
              for (const e2 of ent[1]) {
                const idx = e2.l - 1;
                const src = lines[idx];
                if (src == null) continue;
                const t = src.trim();
                const ds = t.match(/^const\s*\{([^}]*)\}\s*=/);
                if (ds) {
                  const kept = [];
                  for (const part of ds[1].split(',')) {
                    const p2 = part.trim();
                    if (!p2) continue;
                    const base = p2.split('=')[0].trim();
                    if (!e2.names.includes(base)) kept.push(p2);
                  }
                  if (kept.length) {
                    const lead = src.match(/^\s*/)[0];
                    const tail = t.slice(ds[0].length);
                    repLine.set(idx, lead + 'const { ' +
                      kept.join(', ') + ' } =' + tail);
                  } else {
                    del.add(idx);
                  }
                  ops++;
                  rep.push('round ' + round + ' ' + f + ':' +
                    e2.l + ' destrutturazione, rimossi: ' +
                    e2.names.join(', '));
                  continue;
                }
                let done = false;
                for (const nm of e2.names) {
                  const mf = t.match(/^function\s+(\w+)\s*\(/);
                  if (round === 1 && mf && mf[1] === nm) {
                    let depth = 0;
                    let started = false;
                    let j = idx;
                    for (; j < lines.length; j++) {
                      for (const ch of lines[j]) {
                        if (ch === '{') { depth++; started = true; }
                        else if (ch === '}') { depth--; }
                      }
                      if (started && depth === 0) break;
                    }
                    for (let k2 = idx; k2 <= j; k2++) del.add(k2);
                    ops++;
                    rep.push('round ' + round + ' ' + f + ':' +
                      e2.l + ' funzione rimossa: ' + nm +
                      ' (righe ' + (idx + 1) + '-' + (j + 1) + ')');
                    done = true;
                    break;
                  }
                  const mc = t.match(/^const\s+(\w+)\s*=/);
                  if (mc && mc[1] === nm) {
                    let depth = 0;
                    let started = false;
                    let end = -1;
                    for (let j = idx; j < lines.length; j++) {
                      const seg = (j === idx) ?
                        t.slice(mc[0].length) : lines[j];
                      for (const ch of seg) {
                        if (ch === '(' || ch === '[' || ch === '{') {
                          depth++; started = true;
                        } else if (ch === ')' || ch === ']' ||
                          ch === '}') { depth--; }
                      }
                      const closed = lines[j].trimEnd()
                        .endsWith(';');
                      if (closed && ((started && depth <= 0) ||
                          !started)) {
                        end = j;
                        break;
                      }
                    }
                    if (end >= 0) {
                      const whole = lines.slice(idx, end + 1)
                        .join('\n').trim();
                      if (!topComma(whole)) {
                        for (let k2 = idx; k2 <= end; k2++) {
                          del.add(k2);
                        }
                        ops++;
                        rep.push('round ' + round + ' ' + f + ':' +
                          e2.l + ' costante rimossa: ' + nm +
                          ' (righe ' + (idx + 1) + '-' +
                          (end + 1) + ')');
                        done = true;
                        break;
                      }
                    }
                  }
                }
                if (!done) {
                  rep.push('round ' + round + ' ' + f + ':' +
                    e2.l + ' NON automatico: ' + t.slice(0, 70));
                }
              }
              if (del.size || repLine.size) {
                snapshot();
                const out = lines
                  .map((l2, i) => repLine.has(i) ?
                    repLine.get(i) : l2)
                  .filter((l2, i) => !del.has(i));
                fs.writeFileSync(path, out.join('\n'));
              }
            }
            if (!ops) break;
            total += ops;
          }
          const cs2 = contents();
          const concat2 = cs2.join('');
          const orig2 = originsOf(cs2, concat2);
          const lint2 = lintOf(concat2);
          const left = [];
          for (const r of lint2) {
            for (const m of r.messages || []) {
              if (m.ruleId === 'no-unused-vars') {
                left.push('[' + orig2[m.line - 1] + '] ' +
                  m.message);
              }
            }
          }
          rep.push('---');
          rep.push('Dichiarazioni rimosse: ' + total);
          if (left.length) {
            rep.push('Warning residui (da gestire a mano):');
            for (const x of left) rep.push('  ' + x);
          } else {
            rep.push('Nessun warning unused-vars residuo.');
          }
          for (const line of rep) console.log(line);
          if (failed) process.exit(1);
          NODE
          cat /tmp/pulizia.txt

      - name: Commit e push
        run: |
          set -e
          if [ -n "$(git status --porcelain js/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email \
              '41898282+github-actions[bot]@users.noreply.github.com'
            git add js/
            git commit -m 'pulizia: rimuove dichiarazioni mai usate'
            git push
          else
            echo 'Nessuna modifica da committare'
          fi

      - name: Commento riepilogo sulla PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          num=$(gh pr list -R "$GITHUB_REPOSITORY" \
            --head pulizia-codice-morto \
            --json number --jq '.[0].number')
          if [ -z "$num" ] || [ "$num" = 'null' ]; then
            echo 'Nessuna PR aperta, nessun commento
            exit 0
          fi
          {
            echo '### Pulizia automatica'
            echo ''
            echo '```'
            cat /tmp/pulizia.txt 2>/dev/null \
              || echo 'report mancante'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$num" -R "$GITHUB_REPOSITORY" \
            --body-file /tmp/comment.md

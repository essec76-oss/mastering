name: Deploy su Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-produzione
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy in produzione
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica segreti configurati
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!s}" ]; then
              echo "::error::Segreto GitHub mancante: $s — vedi README, sezione Deploy automatico"
              missing=1
            else
              echo "OK: segreto $s presente"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull configurazione progetto
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy in produzione
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

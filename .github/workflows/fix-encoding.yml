name: Fix encoding mojibake v4
on:
  workflow_dispatch:
  push:
    branches: ['fix/encoding-index-html']
permissions:
  contents: write
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/encoding-index-html
          fetch-depth: 0
      - name: Repair
        id: repair
        continue-on-error: true
        run: |
          exec > /tmp/fix.log 2>&1
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- index.html js/
          python3 .github/scripts/fixenc.py
          git status --porcelain
          git add -A
          git commit -m "fix(encoding): ripristina originali da main e corregge mojibake via script" || true
          git push || true
      - name: Persist log
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/fix.log fix-encoding.log 2>/dev/null || echo "no fix.log produced" > fix-encoding.log
          echo "repair outcome: ${{ steps.repair.outcome }}" >> fix-encoding.log
          git checkout -B fix-encoding-logs
          git add fix-encoding.log
          git commit -m "log della run fix-encoding"
          git push -f origin fix-encoding-logs

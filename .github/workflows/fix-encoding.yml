name: Fix encoding mojibake v3
on:
  workflow_dispatch:
  push:
    branches: ['fix/encoding-index-html']
permissions:
  contents: write
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/encoding-index-html
          fetch-depth: 0
      - name: Repair
        id: repair
        continue-on-error: true
        run: |
          exec > /tmp/fix.log 2>&1
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- index.html js/
          cat > /tmp/fixenc.py <<'PYEOF'
import glob

CP1252 = {
    0x80: 0x20AC, 0x82: 0x201A, 0x83: 0x0192, 0x84: 0x201E, 0x85: 0x2026,
    0x86: 0x2020, 0x87: 0x2021, 0x88: 0x02C6, 0x89: 0x2030, 0x8A: 0x0160,
    0x8B: 0x2039, 0x8C: 0x0152, 0x8E: 0x017D, 0x91: 0x2018, 0x92: 0x2019,
    0x93: 0x201C, 0x94: 0x201D, 0x95: 0x2022, 0x96: 0x2013, 0x97: 0x2014,
    0x98: 0x02DC, 0x99: 0x2122, 0x9A: 0x0161, 0x9B: 0x203A, 0x9C: 0x0153,
    0x9E: 0x017E, 0x9F: 0x0178,
}

def build_map():
    m = {}
    for b in range(0x80, 0x100):
        m[chr(b)] = b
    for b, cp in CP1252.items():
        m.setdefault(chr(cp), b)
    return m

M = build_map()

def fix_text(text):
    out = []
    i, n = 0, len(text)
    while i < n:
        ch = text[i]
        if ord(ch) >= 0x80 and ch in M:
            j = i
            while j < n and ord(text[j]) >= 0x80 and text[j] in M:
                j += 1
            run = text[i:j]
            bs = bytes(M[c] for c in run)
            try:
                out.append(bs.decode('utf-8'))
            except UnicodeDecodeError:
                out.append(run)
            i = j
        else:
            out.append(ch)
            i += 1
    return ''.join(out)

def process(path):
    with open(path, encoding='utf-8') as f:
        orig = f.read()
    cur = orig
    for _ in range(3):
        new = fix_text(cur)
        if new == cur:
            break
        cur = new
    if cur != orig:
        with open(path, 'w', encoding='utf-8', newline='') as f:
            f.write(cur)
        print('fixed: ' + path)

for p in ['index.html'] + sorted(glob.glob('js/*.js')):
    process(p)
PYEOF
          python3 /tmp/fixenc.py
          git status --porcelain
          git add -A
          git commit -m "fix(encoding): ripristina originali da main e corregge mojibake via script" || true
          git push || true
      - name: Persist log
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/fix.log fix-encoding.log 2>/dev/null || echo "no fix.log produced" > fix-encoding.log
          echo "repair outcome: ${{ steps.repair.outcome }}" >> fix-encoding.log
          git checkout -B fix-encoding-logs
          git add fix-encoding.log
          git commit -m "log della run fix-encoding"
          git push -f origin fix-encoding-logs

name: Modularizza app.js
on:
  push:
    branches: [modularizzazione]
    paths:
      - 'scripts/modularizza.mjs'
      - '.github/workflows/modularizza.yml'

permissions:
  contents: write

jobs:
  modularizza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Esegui modularizzazione
        run: |
          set -o pipefail
          node scripts/modularizza.mjs 2>&1 | tee /tmp/out.txt
      - name: Commit dei moduli
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: modularizzazione di js/app.js in 12 moduli (ricostruzione byte-identica verificata)"
          git push
      - name: Report su errore
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .split
          cp /tmp/out.txt .split/errore.txt 2>/dev/null || echo "nessun output" > .split/errore.txt
          git add .split
          git commit -m "fail: modularizzazione non riuscita (report)" || true
          git push || true

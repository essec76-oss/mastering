<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastering</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Modale scelta strategia (carica / elimina da cloud) */
  .modal-overlay{position:fixed;inset:0;background:rgba(5,7,10,.65);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .modal-strategie{background:var(--bg,#14171d);border:1px solid var(--border);border-radius:12px;padding:20px;width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);}
  .modal-strategie h3{margin:0;font-size:16px;color:var(--text);}
  #modalStrategieCerca{width:100%;}
  .modal-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;overflow-y:auto;min-height:120px;max-height:50vh;padding:6px;border:1px solid var(--border);border-radius:8px;background:rgba(0,0,0,.15);}
  .strategia-row{display:flex;flex-direction:column;gap:6px;min-width:0;padding:8px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.03);color:var(--text);font-size:13px;cursor:pointer;text-align:left;}
  .strategia-row:hover{border-color:var(--accent,#4f8cff);}
  .strategia-row svg{width:100%;height:50px;display:block;}
  .strategia-nome{display:block;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .strategia-row.selected{border-color:var(--accent,#4f8cff);background:rgba(79,140,255,.18) !important;box-shadow:inset 0 0 0 1px var(--accent,#4f8cff);font-weight:700 !important;}
  .strategia-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;grid-column:1/-1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  /* Riepilogo: griglia a colonne fisse, etichette e valori allineati */
  .riepilogo-grid{
    display:grid;
    grid-template-columns:170px minmax(120px,auto) minmax(110px,auto) minmax(90px,auto) minmax(100px,auto);
    column-gap:12px;
    row-gap:8px;
    align-items:center;
  }
  .riepilogo-grid .rg-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px;border-bottom:1px solid var(--border);}
  .riepilogo-grid .rg-label{font-size:13px;color:var(--text);font-weight:700;white-space:nowrap;}
  .riepilogo-grid .rg-sep{grid-column:1/-1;height:1px;background:var(--border);opacity:.6;margin:2px 0;}
  .rg-val{font-size:14px;font-weight:700;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;padding:4px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .rg-val.big{font-size:20px;padding:4px 14px;}
  .rg-val.sigma{color:var(--yellow);border-color:rgba(241,196,15,.35);}
  .rg-val.pop{color:var(--purple);border-color:rgba(155,89,182,.35);}
  .rg-wide{grid-column:2/-1;justify-self:start;font-size:13px;color:var(--muted);}
  .rg-empty{color:transparent;}
  #cmpHeader{grid-column:1/-1;}
  @media (max-width:640px){
    .riepilogo-grid{grid-template-columns:120px repeat(4,minmax(70px,auto));column-gap:8px;}
    .riepilogo-grid .rg-label{font-size:12px;}
    .rg-val{font-size:12px;padding:4px 6px;}
    .rg-val.big{font-size:16px;}
  }
    .riepilogo-grid .rg-label.wrap{white-space:normal;line-height:1.25;}

  /* ===== Toggle-pill: scritte cliccabili al posto dei checkbox nel pannello Payoff ===== */
  .toggle-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:999px;cursor:pointer;user-select:none;
    font-size:12px;font-weight:600;white-space:nowrap;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    transition:background .15s,color .15s,border-color .15s,box-shadow .15s;
  }
  .toggle-pill input[type="checkbox"]{display:none;}
  /* Stato ATTIVO (visibile sul grafico): colore acceso */
  .toggle-pill:has(input:checked){
    background:rgba(79,140,255,.22);
    border-color:var(--accent,#4f8cff);
    color:#fff;
    box-shadow:inset 0 0 0 1px var(--accent,#4f8cff);
  }
  /* Stato SPENTO (nascosto sul grafico): colore spento */
  .toggle-pill:has(input:not(:checked)){
    background:rgba(255,255,255,.03);
    border-color:var(--border);
    color:var(--muted);
  }
  .toggle-pill:hover{border-color:var(--accent,#4f8cff);}

  /* ===== Pulsante "Salva in cloud": evidenziato in verde ===== */
  .salvati-bar #btnSalvaCome{
    background:#1e9e4a;
    border:1px solid #1e9e4a;
    color:#fff;
    font-weight:700;
    box-shadow:0 2px 8px rgba(30,158,74,.35);
    transition:background .15s, box-shadow .15s, transform .1s;
  }
  .salvati-bar #btnSalvaCome:hover{
    background:#24b857;
    border-color:#24b857;
    box-shadow:0 3px 12px rgba(30,158,74,.55);
  }
  .salvati-bar #btnSalvaCome:active{
    transform:translateY(1px);
    background:#178a3f;
  }
</style>
</head>
<body>
SEE_ARTIFACT_FILE
</body>
</html>

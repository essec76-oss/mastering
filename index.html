  <div class="column" id="colNES">
    <div class="col-header">
      <select id="tipoNES" data-col="NES">
        <option value="-">-</option>
        <option value="NES" selected>NES</option>
        <option value="MES">MES</option>
        <option value="ES">ES</option>
        <option value="X">AZIONI</option>
      </select>
      <div class="col-summary" id="summaryNES">
        <span class="cs-prezzo">@ <strong id="csPrezzoNES">—</strong></span>
      </div>
    </div>
    <div class="movimenti">
      <table>
        <thead>
          <tr>
            <th title="Escludi dai conteggi">☑</th>
            <th></th>
            <th>Pos</th>
            <th>Q.tà</th>
            <th>Prezzo</th>
            <th title="Contratti MES equivalenti (1 MES = 1.0; 1 ES = 10; 1 NES = 0.1)">Delta</th>
            <th>P&amp;L</th>
          </tr>
        </thead>
        <tbody id="bodyNES"></tbody>
      </table>
      <div class="col-footer">
        <div class="cf-item cf-qta">
          <span class="label">Q.tà netta</span>
          <span class="value muted" id="qtaNettaNES">—</span>
        </div>
        <div class="cf-item cf-delta">
          <span class="label" id="deltaLabelNES">Delta</span>
          <span class="value muted" id="deltaAzColNES">—</span>
        </div>
        <div class="cf-item cf-pnl">
          <span class="label">P&amp;L</span>
          <span class="value muted" id="csPnlNES">0,00</span>
        </div>
      </div>
      <button class="btn-add" data-col="NES">+ Aggiungi movimento</button>
    </div>
  </div>
